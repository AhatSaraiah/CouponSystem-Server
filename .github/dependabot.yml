version: 2
# Spring Boot majors are upgraded deliberately: a major bump changes the Java
# baseline and the javax/jakarta namespace, so it should not arrive as a bot PR.
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring-minor-patch:
        patterns:
          - 'org.springframework*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
