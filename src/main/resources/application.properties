# ===============================
# = DATA SOURCE
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / HIBERNATE
# ===============================

# Hibernate ddl auto (create, create-drop, update): with "update" the database
# schema will be automatically updated accordingly to java entities found in
# the project
spring.jpa.hibernate.ddl-auto=update

# Allows Hibernate to generate SQL optimized for a particular DBMS
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL logging is off by default; turn it on locally with SPRING_JPA_SHOW_SQL=true
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# ===============================
# = HTTP
# ===============================
# Honour the platform port when one is injected (Render, Railway, Fly, Heroku)
server.port=${PORT:9096}

# Administrator account. Change these through the environment before deploying.
app.admin.email=${APP_ADMIN_EMAIL:admin@admin.com}
app.admin.password=${APP_ADMIN_PASSWORD:admin}

# Origins allowed to call this API (comma separated)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ===============================
# = ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
