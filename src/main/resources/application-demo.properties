# Demo profile: runs the API against an in-memory H2 database with the sample
# data from DataLoader. Useful for a quick local run or a hosted demo where no
# MySQL instance is available.
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo
#   java -jar target/*.jar --spring.profiles.active=demo

spring.datasource.url=jdbc:h2:mem:coupons;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Override the MySQL dialect from application.properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
